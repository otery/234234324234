name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 설정
        uses: android-actions/setup-android@v3

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 디버그 APK 빌드
        id: build
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: 실패 원인 요약
        if: failure()
        run: |
          echo "================ 실패 원인 ================"
          grep -A 30 "What went wrong" build-log.txt || true
          echo "=========================================="
          grep -E "^e: |error:|Could not resolve|Unresolved reference" build-log.txt | head -40 || true

      - name: 전체 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: APK 업로드
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FoldReveal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
